# ═══════════════════════════════════════════════════════════════════════════
# Contribution Snake — generates the animated SVG used by the README.
#
# It renders your contribution grid as a snake that eats your commits, then
# commits the result to a branch called `output`. The README points at that
# branch via raw.githubusercontent.com, so the image refreshes itself.
#
# Colours match the Midnight Aurora palette:
#   dots  #161B22 → #312E81 → #5B21B6 → #7C3AED → #22D3EE   (empty → busiest)
#   snake #2DD4BF (teal) on dark, #0EA5E9 (sky) on light
#
# ONE-TIME SETUP (this will not work until you do it):
#   Settings → Actions → General → Workflow permissions
#     → select "Read and write permissions" → Save
#   Then: Actions tab → "Contribution Snake" → Run workflow
#
# Docs: CUSTOMIZE.md#snake
# ═══════════════════════════════════════════════════════════════════════════

name: Contribution Snake

on:
  schedule:
    # Twice a day, at 00:17 and 12:17 UTC. Offset from the hour on purpose:
    # GitHub heavily throttles cron jobs scheduled exactly on the hour.
    - cron: "17 0,12 * * *"
  workflow_dispatch:
  push:
    # Namans12/Namans12 defaults to `master`. Both are listed so this keeps
    # working if the branch is ever renamed.
    branches:
      - master
      - main

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0EA5E9&color_dots=#EBEDF0,#C4B5FD,#A78BFA,#7C3AED,#22D3EE
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2DD4BF&color_dots=#161B22,#312E81,#5B21B6,#7C3AED,#22D3EE

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
